{{- if .Values.fleet.enabled }}
{{- /* Fleet requires PostgreSQL — either bundled or external */ -}}
{{- if and (not .Values.fleet.postgres.enabled) (not .Values.fleet.config.postgres.host) }}
{{- fail "fleet.config.postgres.host must be set when fleet.enabled=true and fleet.postgres.enabled=false. Either enable bundled PostgreSQL (fleet.postgres.enabled=true) or provide external PostgreSQL host." }}
{{- end }}
{{- if .Values.secrets.redisPassword }}
{{- fail "fleet.enabled=true is incompatible with secrets.redisPassword. Configure fleet.config.redisURL with authentication instead." }}
{{- end }}
{{- /* Compute PostgreSQL connection info based on bundled vs external */ -}}
{{- $pgHost := "" }}
{{- $pgPort := 5432 }}
{{- $pgDB := "fleet" }}
{{- $pgUser := "fleet" }}
{{- $pgSSLMode := "disable" }}
{{- if .Values.fleet.postgres.enabled }}
  {{- $pgHost = include "octo.fleet.postgres.fullname" . }}
  {{- $pgPort = .Values.fleet.postgres.service.port | default 5432 }}
  {{- $pgDB = .Values.fleet.postgres.auth.database | default "fleet" }}
  {{- $pgUser = .Values.fleet.postgres.auth.username | default "fleet" }}
{{- else }}
  {{- $pgHost = .Values.fleet.config.postgres.host }}
  {{- $pgPort = .Values.fleet.config.postgres.port | default 5432 }}
  {{- $pgDB = .Values.fleet.config.postgres.database | default "fleet" }}
  {{- $pgUser = .Values.fleet.config.postgres.user | default "fleet" }}
  {{- $pgSSLMode = .Values.fleet.config.postgres.sslMode | default "disable" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "octo.fleet.fullname" . }}
  labels:
    {{- include "octo.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "octo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octo.fleet.fullname" . }}
  labels:
    {{- include "octo.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet
spec:
  # Single writer: the entrypoint runs `migrate up` before serving. Migrations
  # are serialized by a Postgres advisory lock, but Recreate + 1 replica keeps
  # rollout simple and avoids old/new pods serving during a schema change.
  replicas: {{ .Values.fleet.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fleet
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "octo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fleet
    spec:
      {{- include "octo.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "octo.image" (dict "repo" .Values.busybox.image.repository "tag" .Values.busybox.image.tag "ctx" .) }}
          command: ['sh', '-c', 'until nc -z {{ $pgHost }} {{ $pgPort }}; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: {{ include "octo.image" (dict "repo" .Values.busybox.image.repository "tag" .Values.busybox.image.tag "ctx" .) }}
          command: ['sh', '-c', 'until nc -z {{ include "octo.redis.host" . }} {{ include "octo.redis.port" . }}; do echo waiting for redis; sleep 2; done']
      containers:
        - name: octo-fleet
          image: {{ include "octo.image" (dict "repo" .Values.fleet.image.repository "tag" .Values.fleet.image.tag "ctx" .) }}
          imagePullPolicy: {{ .Values.fleet.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: {{ .Values.timezone | default "UTC" | quote }}
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: {{ .Values.fleet.config.appEnv | default "production" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.fleet.config.logLevel | default "info" | quote }}
            # PostgreSQL connection
            # FLEET_DB_PASSWORD must be defined BEFORE DATABASE_URL so K8s can
            # expand $(FLEET_DB_PASSWORD) during variable substitution.
            - name: FLEET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "octo.secretName" . }}
                  key: FLEET_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://{{ $pgUser }}:$(FLEET_DB_PASSWORD)@{{ $pgHost }}:{{ $pgPort }}/{{ $pgDB }}?sslmode={{ $pgSSLMode }}"
            # Redis connection
            {{- $redisURL := .Values.fleet.config.redisURL | default (printf "redis://%s:%s/1" (include "octo.redis.host" .) (include "octo.redis.port" .)) }}
            - name: REDIS_URL
              value: {{ $redisURL | quote }}
            # Auth secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "octo.secretName" . }}
                  key: FLEET_JWT_SECRET
            - name: LOOP_CREDENTIAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "octo.secretName" . }}
                  key: FLEET_LOOP_CREDENTIAL_HMAC_KEY
            # octo-server integration
            - name: OCTO_APP_SERVER_URL
              value: "http://{{ include "octo.server.fullname" . }}:8090"
            # Application URLs
            {{- $baseURL := include "octo.externalBaseURL" . }}
            {{- $appURL := .Values.fleet.config.appURL | default (printf "%s/fleet" $baseURL) }}
            {{- $publicURL := .Values.fleet.config.publicURL | default $appURL }}
            {{- $frontendOrigin := .Values.fleet.config.frontendOrigin | default $baseURL }}
            {{- $corsOrigins := .Values.fleet.config.corsOrigins | default $frontendOrigin }}
            {{- $cookieDomain := .Values.fleet.config.cookieDomain | default .Values.domain }}
            - name: MULTICA_APP_URL
              value: {{ $appURL | quote }}
            - name: MULTICA_PUBLIC_URL
              value: {{ $publicURL | quote }}
            - name: FRONTEND_ORIGIN
              value: {{ $frontendOrigin | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ $corsOrigins | quote }}
            - name: COOKIE_DOMAIN
              value: {{ $cookieDomain | quote }}
            # Auth gates
            - name: ALLOW_SIGNUP
              value: {{ .Values.fleet.config.allowSignup | default false | quote }}
          # Hold liveness/readiness off until migrations finish (~5 min budget).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.fleet.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
