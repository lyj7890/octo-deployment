# Example Secret for octo-fleet
#
# Copy this file to fleet-secret.yaml and fill in real values, then apply:
#   kubectl apply -f fleet-secret.yaml -n <namespace>
#
# Or create directly with kubectl:
#   kubectl create secret generic fleet-secret \
#     --from-literal=DATABASE_URL='postgres://fleet:<password>@postgres:5432/fleet?sslmode=disable' \
#     --from-literal=JWT_SECRET='<openssl rand -hex 32>' \
#     --from-literal=LOOP_CREDENTIAL_HMAC_KEY='<openssl rand -hex 32>' \
#     -n <namespace>
#
# Required values:
#   DATABASE_URL             — PostgreSQL connection string
#   JWT_SECRET               — JWT signing secret (min 32 chars, openssl rand -hex 32)
#   LOOP_CREDENTIAL_HMAC_KEY — Loop credential HMAC key (min 32 chars, openssl rand -hex 32)
#
# IMPORTANT: If migrating from octo-multica-backend, reuse the SAME DATABASE_URL
# and JWT_SECRET to avoid invalidating existing sessions and data.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secret
  labels:
    app: octo-fleet
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgres://user:password@host:port/database?sslmode=disable
  # If migrating from octo-multica-backend, use the SAME database connection.
  DATABASE_URL: "postgres://fleet:CHANGE_ME_fleet_db_password@postgres:5432/fleet?sslmode=disable"

  # JWT signing secret — used for authentication tokens
  # MUST be the same as octo-multica-backend-secret if migrating (otherwise all
  # existing sessions are invalidated).
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "CHANGE_ME_jwt_secret_min_32_chars_hex"

  # Loop credential HMAC key — used for device-auth feature (migrations 200/201)
  # This is NEW in octo-fleet and has no prior value to reuse from octo-multica.
  # Generate with: openssl rand -hex 32
  LOOP_CREDENTIAL_HMAC_KEY: "CHANGE_ME_loop_credential_hmac_key_hex"
