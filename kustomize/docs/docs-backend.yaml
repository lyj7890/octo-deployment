# octo-docs-backend: Hocuspocus + Yjs real-time collaborative document backend
#
# Two listeners in one process:
#   REST API   :3000  — docs CRUD, collab-token issuance, attachments
#   Hocuspocus :1234  — real-time Yjs WebSocket sync
#
# Prerequisites:
#   - MySQL with `octo_docs` database created
#   - Redis available at redis:6379
#   - MinIO with `octo-docs-attachments` bucket created
#   - docs-secret created with required credentials
apiVersion: v1
kind: Service
metadata:
  name: octo-docs-backend
  labels:
    app: octo-docs-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ws
      port: 1234
      targetPort: ws
  selector:
    app: octo-docs-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octo-docs-backend
  labels:
    app: octo-docs-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: octo-docs-backend
  template:
    metadata:
      labels:
        app: octo-docs-backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: octo-docs-backend
          image: mininglamposs/octo-docs-backend:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: ws
              containerPort: 1234
          envFrom:
            - configMapRef:
                name: docs-config
            - secretRef:
                name: docs-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
